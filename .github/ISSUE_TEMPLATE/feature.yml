name: New feature or behavior change
description: "Choose when something isn't broken, but you want it to be better."
body:
  - type: textarea
    id: desired
    validations:
      required: true
    attributes:
      label: What should happen
      placeholder: |
        {{PROJECT_NAME}} should have a setting that does X.
      description: >
        Be specific and descriptive.

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: "Check the [latest build]({{REPO_URL}}/actions) in case it's already implemented."
          required: true
        - label: "[Search for other requests]({{REPO_URL}}/issues) of the same feature."
          required: true
