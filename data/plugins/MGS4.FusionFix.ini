[MAIN]
SkipIntro=true

; set this to 1 to disable dynamic res and fix the blurred output, 0 for default game behavior
DynamicResolutionOverride=1.0

; set to some small value like reciprocal of 512, 0 for default game behavior
ShadowTexelOverride=0.001953125

; set to whatever value thats not above 8192, 0 for default game behavior
ShadowResolutionOverride=4096